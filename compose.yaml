name: hhn-cloud
services:
  postgres:
    image: postgres:17-alpine
    container_name: "${COMPOSE_PROJECT_NAME}-postgres"
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: "${COMPOSE_PROJECT_NAME}-redis"
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec
      --save 60 1
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
